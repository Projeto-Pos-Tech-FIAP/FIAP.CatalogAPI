name: ci-cd

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  pipeline:
    uses: Projeto-Pos-Tech-FIAP/FIAP.Orchestration/.github/workflows/dotnet-service.yml@main
    with:
      solution: FIAP.CatalogAPI.slnx
      service-name: catalog-api
    secrets:
      ORCHESTRATION_TOKEN: ${{ secrets.ORCHESTRATION_TOKEN }}
